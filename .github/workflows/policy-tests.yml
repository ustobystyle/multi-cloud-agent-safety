name: Policy Gate Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic policy and audit tests
        run: python -m unittest discover -s tests -v
      - name: Run simulated incident walkthrough
        run: python demo.py --audit /tmp/policy-gate-ci-audit.jsonl
